<style>

.h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;touch-action:none}.h.l{left:0}.h.r{right:0}

.big{font:500 54px 'JetBrains Mono',monospace;text-align:center}
.pi{width:100%;padding:9px 12px;text-align:left;border-radius:9px}.pi.on{background:#3b82f633}
.cols{display:flex;align-items:flex-end;gap:8px;height:120px}.cols div{flex:1;text-align:center;font-size:10px;color:var(--mu)}.cols i{display:block;background:linear-gradient(#22d3ee,#2563eb);border-radius:6px 6px 0 0;margin-bottom:4px;min-height:2px}

@media(max-width:720px){#app{grid-template-columns:1fr}#nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9;border:0;border-top:1px solid var(--bd);backdrop-filter:blur(16px)}#nav .lg{display:none}#nav button{width:auto;flex:1}#fab{bottom:calc(84px + env(safe-area-inset-bottom))}.sb{min-width:0}.sb span,.sb kbd{display:none}#top,main{padding-left:14px;padding-right:14px}.r3{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"><nav id="nav" aria-label="Primary"></nav><div id="wrap"><header id="top"><div class="wm">CHRONOS <em>MED</em></div><button class="sb" data-a="pal" aria-label="Search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search…</span><kbd>Ctrl K</kbd></button><button id="pill" data-a="tp"></button></header><main id="main"></main></div></div>
<button id="fab" data-a="add" aria-label="Quick add">+</button><div id="md" class="ov"><div class="box g" id="mb"></div></div><div id="toast" class="g"></div>
<script>
const K='chronosmed.v1',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ymd(new Date());
const addD=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n))};
const diff=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const hm=m=>{const h=Math.floor(m/60)%24;return(h%12||12)+':'+pad(m%60)+(h<12?' AM':' PM')};
const toT=m=>pad(Math.floor(Math.min(m,1439)/60))+':'+pad(Math.min(m,1439)%60),fromT=v=>{const[h,m]=v.split(':').map(Number);return h*60+m};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TYPES=[['study','First study','#4f8dff'],['revision','Revision','#a78bfa'],['practice','Question practice','#22d3ee'],['test','Test','#f59e0b'],['lecture','Lecture','#60a5fa'],['clinical','Clinical work','#34d399'],['break','Break','#64748b'],['meal','Meal','#fb923c'],['other','Other','#94a3b8']];
const ST=[['ns','Not started'],['ip','In progress'],['done','Completed'],['review','Needs review']];
const SUBS="Anatomy|ANA,Physiology|PHY,Biochemistry|BIO,Pathology|PAT,Pharmacology|PHA,Microbiology|MIC,Forensic Medicine and Toxicology|FMT,Community Medicine|CM,General Medicine|MED,General Surgery|SUR,Obstetrics and Gynaecology|OBG,Pediatrics|PED,Orthopaedics|ORT,Otorhinolaryngology (ENT)|ENT,Ophthalmology|OPH,Dermatology|DER,Psychiatry|PSY,Anaesthesiology|ANS,Radiology|RAD".split(',');
const def=()=>({subjects:SUBS.map((x,i)=>{const[n,ab]=x.split('|');return{id:'s'+i,n,ab,c:`hsl(${(i*37+200)%360} 75% 64%)`}}),topics:[],acts:[],focus:[],timer:null,prefs:{snap:15,pomo:25,goal:240,iv:[1,3,7,14,30],exam:null,zoom:90}});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign(def(),S||{});S.prefs=Object.assign(def().prefs,S.prefs);
let V='today',D=today(),F='',SD=null,E=null,PI=0,drag=null,H=[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save — storage full or blocked')}};
const commit=()=>{save();render()};
const mut=f=>{H.push(JSON.stringify(S.acts));if(H.length>30)H.shift();f();save()};
const undo=()=>{if(!H.length)return toast('Nothing to undo');S.acts=JSON.parse(H.pop());commit();toast('Undone')};
const sub=id=>S.subjects.find(x=>x.id===id),tpc=id=>S.topics.find(x=>x.id===id);
const col=a=>(a.sid&&sub(a.sid)?sub(a.sid).c:TYPES.find(t=>t[0]===a.type)[2]);
const dayActs=d=>S.acts.filter(a=>a.date===d).sort((a,b)=>a.s-b.s||a.e-b.e);
const fsum=f=>Math.round(f.reduce((a,x)=>a+x.secs,0)/60);
/* study credit = completed study blocks (planned length) + timed sessions not already covered by a completed block */
function credits(){const L=[],dn=new Set();S.acts.forEach(a=>{if(a.done&&!NS.includes(a.type)){dn.add(a.id);const fm=S.focus.filter(f=>f.aid===a.id).reduce((x,f)=>x+f.secs,0)/60;L.push({date:a.date,sid:a.sid,tid:a.tid,m:Math.max(a.e-a.s,fm)})}});S.focus.forEach(f=>{if(!dn.has(f.aid))L.push({date:f.date,sid:f.sid,tid:f.tid,m:f.secs/60})});return L}
const cmins=fn=>Math.round(credits().filter(fn).reduce((a,x)=>a+x.m,0));
/* completing a First-study block puts its topic into the revision queue */
function afterDone(a,quiet){if(!a||!a.done||a.type!=='study'||!a.sid)return;let t=a.tid&&tpc(a.tid);
 if(!t){const n=(a.title||'').trim();if(!n)return;t=S.topics.find(x=>x.sid===a.sid&&x.n.toLowerCase()===n.toLowerCase());if(!t){t={id:uid(),sid:a.sid,pid:null,n,st:'ns',hist:[]};S.topics.push(t)}a.tid=t.id}
 t.st='done';t.studied=t.studied||a.date;
 if(!t.rev){t.rev={i:0,next:addD(a.date,S.prefs.iv[0])};(t.hist=t.hist||[]).push({d:a.date,r:'studied'});if(!quiet)toast('“'+t.n+'” added to Revision · due '+t.rev.next)}}
const NS=['break','meal'];
const IC={today:'<path d="M12 3v3M4 9h16M5 5h14v15H5z"/><path d="M9 14l2 2 4-4"/>',planner:'<path d="M3 6h18M3 12h12M3 18h16"/>',subjects:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM8 7h7"/>',revision:'<path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/>',analytics:'<path d="M5 20V10M12 20V4M19 20v-7"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'};
$('#nav').innerHTML='<div class="lg"><svg class="i" viewBox="0 0 24 24" style="stroke:#fff"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></div>'+Object.keys(IC).map(k=>`<button data-nav="${k}"><svg class="i" viewBox="0 0 24 24">${IC[k]}</svg>${k[0].toUpperCase()+k.slice(1)}</button>`).join('');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)}
function md(h){$('#mb').innerHTML=h;$('#md').classList.add('on');const f=$('#mb input,#mb select');}
const closeMd=()=>{$('#md').classList.remove('on');E=null};
const subOpts=(sel)=>S.subjects.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.n)}</option>`).join('');
function findFree(d,len){const sn=S.prefs.snap;let s=Math.max(360,Math.ceil((d===today()?nowMin():540)/sn)*sn);const as=dayActs(d);for(;s+len<=1440;s+=sn)if(!as.some(a=>a.s<s+len&&a.e>s))return s;return 360}
function streak(){const ds=new Set(credits().filter(c=>c.m>=1).map(c=>c.date));let d=today(),n=0;if(!ds.has(d))d=addD(d,-1);while(ds.has(d)){n++;d=addD(d,-1)}return n}
function ring(p,txt,sub){const c=2*Math.PI*52;return`<svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="52" fill="none" stroke="rgba(120,170,255,.15)" stroke-width="10"/><circle cx="65" cy="65" r="52" fill="none" stroke="url(#gg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 65 65)"/><defs><linearGradient id="gg"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><text x="65" y="63" text-anchor="middle" fill="#fff" font-size="22" font-family="JetBrains Mono">${txt}</text><text x="65" y="82" text-anchor="middle" fill="#8ea3cf" font-size="11">${sub}</text></svg>`}
/* ---------- views ---------- */
function vToday(){const t=today(),as=dayActs(t),cm=nowMin(),g=S.prefs.goal,fm=cmins(c=>c.date===t);
 const st=as.filter(a=>!NS.includes(a.type)),pl=st.reduce((a,x)=>a+x.e-x.s,0),dn=st.filter(a=>a.done).length;
 const nx=st.find(a=>!a.done&&a.e>cm),due=S.topics.filter(x=>x.rev&&x.rev.next<=t).length,hr=new Date().getHours();
 const ex=S.prefs.exam;const exd=ex&&ex.date?diff(t,ex.date):null;
 const rec=nx?'':due?`<p class="mu">${due} revision${due>1?'s':''} due. <button class="gh" data-a="go" data-v="revision">Open queue</button></p>`:`<p class="mu">Nothing scheduled next. <button class="gh" data-a="add">Plan a session</button></p>`;
 return`<h1>${hr<12?'Good morning':hr<18?'Good afternoon':'Good evening'}, Neel</h1><p class="mu">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}${exd!=null&&exd>=0?` · <span class="wn">${exd} days to ${esc(ex.name||'exam')}</span>`:''}</p>
 <div class="gr"><div class="g c row">${ring(Math.min(1,fm/g),Math.floor(fm/60)+'h '+fm%60+'m','of '+Math.round(g/60*10)/10+'h goal')}<div><div class="mu">Planned ${Math.floor(pl/60)}h ${pl%60}m<br>Done ${dn}/${st.length} · Left ${st.length-dn}</div><div style="margin-top:8px">Streak <b class="mn">${streak()}d</b></div></div></div>
 <div class="g c"><h2>${S.timer?'Focus in progress':'Next up'}</h2>${S.timer?`<p>${esc(S.timer.label)}</p><button class="pr" data-a="tp" style="margin-top:8px">Open timer</button>`:nx?`<div class="row"><i class="dot" style="background:${col(nx)}"></i><div><b>${esc(nx.title)}</b><div class="mu mn">${hm(nx.s)} – ${hm(nx.e)}</div></div><button class="pr sp" data-a="tact" data-id="${nx.id}">Start</button></div>`:`<p class="mu">No upcoming session today.</p>`}${rec}</div>
 <div class="g c"><h2>Revision due</h2>${due?`<b class="mn" style="font-size:28px">${due}</b> <span class="mu">topics</span><br><button class="gh" data-a="go" data-v="revision" style="margin-top:8px">Review now</button>`:'<p class="mu">Queue is clear.</p>'}</div></div>
 <div class="g c" style="margin-top:14px"><div class="row"><h2>Today's schedule</h2><button class="gh sp" data-a="go" data-v="planner">Open planner</button></div>${as.length?as.map(a=>`<div class="li"><button class="chk ${a.done?'on':''}" data-a="tg" data-id="${a.id}" aria-label="Toggle complete">${a.done?'✓':''}</button><i class="dot" style="background:${col(a)}"></i><div style="flex:1"><div>${esc(a.title)}</div><div class="mu mn" style="font-size:11px">${hm(a.s)} – ${hm(a.e)}</div></div><button class="gh" data-a="ed" data-id="${a.id}">Edit</button></div>`).join(''):'<div class="emp">Your day is empty. Tap + or click the planner timeline to add your first block.</div>'}</div>`}
function timeline(){const ph=S.prefs.zoom,t0=360,t1=1440,w=(t1-t0)/60*ph,cm=nowMin();
 const as=dayActs(D).filter(a=>!F||a.sid===F),lanes=[],ln={};as.forEach(a=>{let i=lanes.findIndex(e=>e<=a.s);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=a.e;ln[a.id]=i});
 const h=Math.max(lanes.length,2)*60+14;let ru='';for(let m=t0;m<t1;m+=60)ru+=`<div class="tk" style="left:${(m-t0)/60*ph}px">${hm(m).replace(':00','')}</div>`;
 const bl=as.map(a=>{const cf=as.some(b=>b!==a&&b.s<a.e&&b.e>a.s),ms=!a.done&&(D<today()||(D===today()&&a.e<cm));
  return`<div class="blk ${a.done?'done':''} ${cf?'cf':''} ${ms?'miss':''}" tabindex="0" data-id="${a.id}" role="button" aria-label="${esc(a.title)} ${hm(a.s)} to ${hm(a.e)}" style="--c:${col(a)};left:${(a.s-t0)/60*ph}px;width:${(a.e-a.s)/60*ph}px;top:${ln[a.id]*60+8}px"><i class="h l"></i><b>${a.done?'✓ ':''}${esc(a.title)}</b><span>${hm(a.s)}–${hm(a.e)}</span><i class="h r"></i></div>`}).join('');
 return`<div id="tls" class="g"><div style="width:${w}px"><div class="rl">${ru}</div><div id="cv" style="height:${h}px;background:repeating-linear-gradient(90deg,var(--bd) 0 1px,transparent 1px ${ph}px)">${bl}${D===today()&&cm>=t0?`<div id="now" style="left:${(cm-t0)/60*ph}px"></div>`:''}</div></div></div>`}

 return`<div class="row"><h1>Planner</h1><span class="mu">${new Date(D+'T00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}</span></div>

const elapsed=T=>T.accum+(T.running?Date.now()-T.at:0),fmt=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600);return(h?h+':':'')+pad(Math.floor(s/60)%60)+':'+pad(s%60)};
function startTimer(aid,sid,tid,label,mins){if(S.timer){toast('A timer is already running');return openTimer()}S.timer={aid,sid,tid,label,at:Date.now(),t0:Date.now(),accum:0,running:true,target:mins*60000,dist:0,note:''};save();openTimer();render()}
function openTimer(){const T=S.timer;if(!T)return md(`<h3>Focus timer</h3><label>Subject<select id="ts"><option value="">No subject</option>${subOpts()}</select></label><label>Minutes (0 = stopwatch)<input id="tm" type="number" min="0" value="${S.prefs.pomo}"></label><div class="bt"><button class="pr" data-a="tstart">Start</button></div>`);

 if(T.target&&el>=T.target&&!T.rd){T.rd=true;save();openTimer();toast('Target reached — finish, or keep going');T.target=0;T.at=Date.now()-0;}

 case'addt':{const n=$('#tn').value.trim();if(!n)return toast('Enter a topic name');S.topics.push({id:uid(),sid:SD,pid:$('#tp2').value||null,n,st:'ns',hist:[]});commit();$('#tn').focus();break}
 case'bulk':{const st=[];$('#tb').value.split('\n').filter(l=>l.trim()).forEach(l=>{const d=Math.floor((l.match(/^[ \t]*/)[0].replace(/\t/g,'  ').length)/2),t={id:uid(),sid:SD,pid:d?(st[d-1]||st[st.length-1]||{}).id||null:null,n:l.trim().replace(/^[-•*]\s*/,''),st:'ns',hist:[]};st.length=d;st[d]=t;S.topics.push(t)});commit();toast('Topics added');break}
 case'cyc':{const t=tpc(id),i=(ST.findIndex(x=>x[0]===t.st)+1)%4;t.st=ST[i][0];if(t.st==='done'){t.studied=today();if(!t.rev)setRev(t)}if(t.st==='review')t.rev={i:t.rev?.i||0,next:today()};commit();break}
 case'dt':if(confirm('Delete topic and its subtopics? Linked activities stay.')){const ids=new Set([id]);let ch=1;while(ch){ch=0;S.topics.forEach(t=>{if(ids.has(t.pid)&&!ids.has(t.id)){ids.add(t.id);ch=1}})}S.topics=S.topics.filter(t=>!ids.has(t.id));S.acts.forEach(x=>{if(ids.has(x.tid))x.tid=''});commit()}break;
 case'sch':{const t=tpc(id),d=V==='planner'?D:today(),s=findFree(d,45);openEd(null,{sid:t.sid,tid:t.id,title:t.n,date:d,s,e:s+45});break}
 case'rsch':{const t=tpc(id),d=t.rev&&t.rev.next>today()?t.rev.next:today(),s=findFree(d,30);openEd(null,{sid:t.sid,tid:t.id,title:'Revise: '+t.n,type:'revision',date:d,s,e:s+30});break}
 case'rv':setRev(tpc(id),v);commit();break;case'pr':window._pl[+id][1]();if($('#pq'))closeMd();break;
 case'exp':exportData();break;case'imp':$('#fi').click();break;
 case'rst':if(confirm('Erase ALL Chronos Med data in this browser?')&&confirm('This cannot be undone. Erase everything?')){S=def();H=[];SD=null;commit()}break}}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='pq'){PI=0;openPal(t.value)}else if(t.id==='sq'||t.id==='so'){$('#sg').innerHTML=sgrid()}else if(t.id==='tn2'&&S.timer){S.timer.note=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='es')fillTopics();else if(t.id==='dp'&&t.value){D=t.value;render()}else if(t.id==='ff'){F=t.value;render()}
 else if(t.id==='fi'){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.subjects||!d.acts)throw 0;if(confirm('Replace current data with this file?')){S=Object.assign(def(),d);commit();toast('Imported')}}catch(x){toast('Not a valid Chronos Med file')}};r.readAsText(t.files[0])}
 else if(t.dataset.k){const k=t.dataset.k,p=S.prefs;if(k==='iv'){const a=t.value.split(',').map(Number).filter(n=>n>0);if(a.length)p.iv=a}else if(k==='exn'||k==='exd'){p.exam=Object.assign({name:'',date:''},p.exam,{[k==='exn'?'name':'date']:t.value})}else p[k]=+t.value||p[k];commit()}});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();PI=0;$('#pq')?closeMd():openPal()}
 else if(e.key==='Escape')closeMd();
 else if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();undo()}
 else if($('#pq')){if(e.key==='ArrowDown'){PI=Math.min(PI+1,window._pl.length-1);openPal($('#pq').value);e.preventDefault()}else if(e.key==='ArrowUp'){PI=Math.max(0,PI-1);openPal($('#pq').value);e.preventDefault()}else if(e.key==='Enter'&&window._pl[PI]){window._pl[PI][1]();if($('#pq'))closeMd()}}
 else if(document.activeElement.classList?.contains('blk')){const b=document.activeElement,a=S.acts.find(x=>x.id===b.dataset.id),sn=S.prefs.snap;
  if(e.key==='Enter'){openEd(a.id)}else if(e.key.startsWith('Arrow')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();const d=(e.key==='ArrowLeft'?-sn:sn);mut(()=>{if(e.shiftKey){a.e=Math.max(a.s+sn,Math.min(1440,a.e+d))}else if(a.s+d>=360&&a.e+d<=1440){a.s+=d;a.e+=d}});commit();document.querySelector(`.blk[data-id="${a.id}"]`)?.focus()}}});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.blk');if(!b)return;const a=S.acts.find(x=>x.id===b.dataset.id);drag={a,b,x:e.clientX,s:a.s,e:a.e,mode:e.target.classList.contains('l')?'l':e.target.classList.contains('r')?'r':'m',moved:false};try{b.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>4)drag.moved=true;if(!drag.moved)return;const sn=S.prefs.snap,z=S.prefs.zoom,dm=Math.round(dx/z*60/sn)*sn;let s=drag.s,en=drag.e;
 if(drag.mode==='m'){const L=en-s;s+=dm;en+=dm;if(s<360){s=360;en=s+L}if(en>1440){en=1440;s=en-L}}else if(drag.mode==='l')s=Math.min(Math.max(360,s+dm),en-sn);else en=Math.max(Math.min(1440,en+dm),s+sn);
 drag.ns=s;drag.ne=en;drag.b.style.left=(s-360)/60*z+'px';drag.b.style.width=(en-s)/60*z+'px';drag.b.querySelector('span').textContent=hm(s)+'–'+hm(en)});
document.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(!d.moved)return openEd(d.a.id);if(d.ns==null||(d.ns===d.s&&d.ne===d.e))return render();mut(()=>{d.a.s=d.ns;d.a.e=d.ne});commit();conflict(d.a)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();render()}});
if(!S.prefs.mig1){S.acts.filter(a=>a.done).sort((a,b)=>b.date.localeCompare(a.date)).forEach(a=>afterDone(a,true));S.prefs.mig1=1;save()}
render();if(S.timer)openTimer(),$('#md').classList.remove('on');
