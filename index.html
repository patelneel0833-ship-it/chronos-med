if(!S.prefs.mig2){S.acts.forEach(a=>{const t=a.tid&&tpc(a.tid);if(!t||!sub(t.sid))return;if(a.title===t.n)a.title=tname(t);else if(a.title==='Revise: '+t.n)a.title='Revise: '+tname(t)});S.prefs.mig2=1;save()}
if(!S.prefs.mig1){S.acts.filter(a=>a.done).sort((a,b)=>b.date.localeCompare(a.date)).forEach(a=>afterDone(a,true));S.prefs.mig1=1;save()}
render();if(S.timer)openTimer(),$('#md').classList.remove('on');
</script></body></html>
